name: clean_k_chart
description: >-
  A customizable K-line (candlestick) chart for Flutter. Supports MA/EMA/BOLL/SAR
  main indicators, MACD/KDJ/RSI/WR/CCI secondary indicators, volume charts,
  cross-line info windows and rich style customization.
version: 1.0.0
homepage: https://github.com/icecode-ai/clean_k_chart

environment:
  sdk: ^3.13.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
