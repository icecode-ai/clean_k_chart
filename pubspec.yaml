version: 0.0.4
homepage: https://github.com/icecode-ai/clean_k_chart

environment:
  sdk: ^3.13.0

dependencies:
  decimal: ^3.2.6
  flutter:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_lints: ^6.0.0
